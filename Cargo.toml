[package]
name = "browser-automation-cli"
version = "0.1.6"
edition = "2021"
rust-version = "1.88.0"
authors = ["Danilo Aguiar <daniloaguiarbr@proton.me>"]
license = "MIT OR Apache-2.0"
description = "One-shot browser automation CLI for AI agents via Chrome CDP. BORN EXECUTE FINALIZE DIE. No daemon, no npm, no telemetry."
readme = "README.md"
keywords = ["browser", "automation", "ai", "cdp", "chrome"]
categories = ["command-line-utilities", "web-programming"]
repository = "https://github.com/danilo-aguiar-br/browser-automation-cli"
homepage = "https://github.com/danilo-aguiar-br/browser-automation-cli"
documentation = "https://docs.rs/browser-automation-cli"
exclude = [
    ".github/",
    "base_conhecimento_chrome-devtools-mcp-main/",
    "docs_prd/",
    "docs_rules/",
    "/gaps.md",
    ".enrich-queue.sqlite",
    ".enrich-queue.sqlite-*",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/MEMORY.md",
    "graphrag.sqlite",
    "graphrag.sqlite-*",
    "graphrag*",
    ".serena/",
    ".claude/",
    ".vscode/",
    ".setting.cyber/",
    "logs/",
    "memory/",
]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
# Explicit targets required after docs.rs 2026-05-01 (no implicit multi-target).
# wasm32 omitted: Chrome CDP automation is host-only (see crate `//!` Targets).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-musl",
]
# docsrs enables `#![feature(doc_cfg)]` in lib.rs (not doc_auto_cfg; Oct 2025 merge).
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[badges]
maintenance = { status = "actively-developed" }

[[bin]]
name = "browser-automation-cli"
path = "src/main.rs"

[dependencies]
# Default CLI allocator (rules_rust_economia_de_recursos). Measure RSS via
# `scripts/rss-baseline.sh` before claiming wins vs system malloc.
mimalloc = { version = "0.1", default-features = false }
# Fast non-crypto hasher for trusted in-process maps (rules_rust_eficiencia —
# FxHash for digests / integer-like keys; not for untrusted DoS surfaces).
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
base64 = "0.22"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
# CPU-bound fan-out (sg scan, multi-file text); sized via concurrency::rayon_threads.
rayon = "1.10"
chromiumoxide = "0.9.1"
futures = "0.3"
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
# 0.13 aligns with the reqwest chromiumoxide 0.9 already pulls (single copy in
# the graph). 0.13 split the old `rustls-tls-webpki-roots` feature into
# `rustls` + `webpki-roots`; the combination is the same TLS stack (rustls with
# bundled webpki roots, no native-tls).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "stream", "blocking"] }
sha2 = "0.10"
aes-gcm = "0.10"
# Wipe derived session encryption keys on stack before drop (rules: sensitive memory zeroize).
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
# socket2: transitive via tokio/hyper only (Pass N — no direct product use).
similar = "2"
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
clap = { version = "4", features = ["derive", "wrap_help", "string", "cargo", "color", "suggestions"] }
clap_complete = "4"
clap_mangen = "0.2"
thiserror = "2"
human-panic = "2"
# Cross-platform live-process enumeration for residual wipe safety (GAP-045).
# Pinned to 0.38 (not the newer 0.39) because human-panic already pulls
# sysinfo 0.38 transitively; declaring 0.39 would add a duplicate (GAP-022).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
# env-filter + fmt + registry: composition; json: file sink; tracing-log: bridge
# log crate records from deps (reqwest/etc.) into tracing events (local only).
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry", "tracing-log"] }
tracing-appender = "0.2"
tracing-error = "0.2"
# i18n stack (rules_rust multi-idioma): OS locale → BCP47 → negotiate → OnceLock.
# Full ICU calendar/collator intentionally omitted (agent CLI; machine JSON stays English).
sys-locale = "0.3"
# macros: langid! for compile-time identifiers (rules: unic-langid LanguageIdentifier).
unic-langid = { version = "0.9", features = ["macros"] }
# 0.14 switched to icu_locid::LanguageIdentifier and breaks fluent 0.17 (unic-langid).
# Pin 0.13 for a single LanguageIdentifier type across negotiation + FluentBundle.
fluent-langneg = "0.13"
fluent = "0.17"
unicode-segmentation = "1"
robotstxt = "0.3"
# Optional: Mermaid in rustdoc only. Keep off default builds to avoid
# proc-macro-error2 future-incompat on daily cargo install/build.
# docs.rs enables it via all-features = true.
aquamarine = { version = "0.6", optional = true }
directories = "5"
scraper = "0.22"
petgraph = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
rcgen = "0.14.8"
hudsucker = "0.25.0"
lopdf = "0.44"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
# 0.36 is required to pull quick-xml >= 0.41, which closes RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 (both severity 7.5, both reachable from the public `parse`
# command on operator-supplied XLSX). 0.36 does not link under `lto = "fat"`;
# the release profile uses `lto = "thin"` for this reason — see [profile.release].
calamine = "0.36"
rust_xlsxwriter = "0.79"
csv = "1.3"
ignore = "0.4"
regex = "1"
qrcode = "0.14"
rqrr = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Console",
    # free_ram_mb via GlobalMemoryStatusEx (rules_rust_paralelismo permits formula).
    "Win32_System_SystemInformation",
    # Chrome App Paths discovery (HKLM/HKCU …\App Paths\chrome.exe).
    "Win32_System_Registry",
] }

# Optional locale packs beyond MVP en + pt-BR (rules: never ship top-20 by default).
[features]
default = []
# Mermaid lifecycle diagrams in rustdoc via aquamarine (docs.rs / cargo doc only).
# Not on default: aquamarine → proc-macro-error2 currently emits future-incompat.
docs-mermaid = ["dep:aquamarine"]
# Scaffold only — additional FTL packs land behind these flags when translated.
i18n-cjk = []
i18n-rtl = []
i18n-europe = []
i18n-full = ["i18n-cjk", "i18n-rtl", "i18n-europe"]
i18n-pseudo = []

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cli_parse"
harness = false

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Release (rules_rust_eficiencia_e_performance) ───────────────────────────
# Speed-first profile for the one-shot agent binary. Cross-crate LTO + single
# CGU maximize inlining; panic=abort drops unwind tables (CLI never catches
# panics for recovery). strip=symbols keeps distributed artifacts small.
# overflow-checks left at release default (false) after audit: no financial
# math hot path; debug/test profiles keep checks on.
# Never set target-cpu=native here — that belongs only to local .cargo overrides.
[profile.release]
opt-level = 3
# "thin" and NOT "fat" — deliberate, security-driven (GAP-001).
#
# calamine 0.36 references the encoding_rs statics (UTF_8 / UTF_16LE / UTF_16BE)
# from `open_workbook` and `cfb`. Under `lto = "fat"` those symbols are dropped
# and `cargo build --release` fails to link (reproduced with both mold and GNU
# ld.bfd, after `cargo clean -p calamine -p encoding_rs`). `lto = "thin"` links.
#
# Staying on calamine 0.30 to keep fat LTO would keep quick-xml 0.37, which
# carries RUSTSEC-2026-0194 (quadratic parse on duplicate attribute names) and
# RUSTSEC-2026-0195 (unbounded namespace allocation). Both are severity 7.5 and
# both are reachable from the public `parse` command on operator-supplied XLSX.
#
# Measured cost of thin: ~30.41 MB (fat/0.30) to ~31.70 MB (thin/0.36), about
# +4%. Trading 1.29 MB for two reachable DoS advisories is not a trade worth
# making. Revisit fat LTO only if upstream calamine/encoding_rs fixes the drop.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

# Explicit dependency optimisations (rules: [profile.release.package."*"]).
# Root package already uses opt-level=3; this documents and pins deps the same
# way so a future package-level override cannot silently ship soft deps.
[profile.release.package."*"]
opt-level = 3

# Size-optimized alternate (cargo build --profile release-size). Same LTO/CGU
# stack as release; opt-level "z" trades some speed for smaller text.
[profile.release-size]
inherits = "release"
opt-level = "z"

# Latency / flamegraph profiling (rules_rust_latencia_reduzir): keep LTO/CGU
# and panic=abort from release, but retain line tables (`debug = 1`) and do not
# strip symbols so `perf` / `cargo flamegraph` can attribute samples.
# Usage: cargo build --profile release-prof
# Not for distribution — use [profile.release] for published binaries.
[profile.release-prof]
inherits = "release"
debug = 1
strip = "none"

# Criterion / cargo bench: match production optimisations so microbenches are
# not compared against a soft dev build (rules: never debug vs release).
[profile.bench]
inherits = "release"
# Criterion harness needs unwind; Cargo forces unwind for benches regardless.
debug = false
lto = "thin"
codegen-units = 1

# Dev: keep our crate debuggable, but optimise dependencies so CDP/reqwest
# paths are usable without a full --release rebuild every iteration.
[profile.dev.package."*"]
opt-level = 2

# Build scripts / proc-macros: prefer compile speed over runtime optimisations.
[profile.dev.build-override]
opt-level = 0
codegen-units = 16

[profile.release.build-override]
opt-level = 0
codegen-units = 16

