[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
# Explicit targets required after docs.rs 2026-05-01 (no implicit multi-target).
# wasm32 omitted: Chrome CDP automation is host-only (see crate `//!` Targets).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-musl",
]
# docsrs enables `#![feature(doc_cfg)]` in lib.rs (not doc_auto_cfg; Oct 2025 merge).
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[badges]
maintenance = { status = "actively-developed" }

# Lint policy for the whole PACKAGE, not for one target.
#
# These lived as `#![warn(..)]` / `#![deny(..)]` at the top of `src/lib.rs`,
# where a crate attribute reaches exactly one crate: the library. `src/main.rs`
# is a second crate and every file under `tests/` is another, so the policy never
# arrived at any of them. `cargo clippy --all-targets -- -D warnings` was green
# because the rule was absent, not because the code obeyed — forcing the clone
# lints on the command line surfaced two real `redundant_clone` hits in
# `tests/residual_report_contract.rs` that the green gate had never seen, while
# the identical pattern in `src/residual/tests.rs` was caught the day before
# because that file compiles INSIDE the lib. The `[lints]` table (Cargo 1.74+) is
# the only mechanism Cargo injects into every target of the package.
[lints.rust]
missing_docs = "warn"
# Safety hygiene: `unsafe` inside an `unsafe fn` still needs its own block.
unsafe_op_in_unsafe_fn = "deny"
# `static mut` references are a silent aliasing bug factory
# (rules_rust_const_static_inicializacao).
static_mut_refs = "deny"

[lints.rustdoc]
missing_crate_level_docs = "warn"
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "warn"

[lints.clippy]
# Document every `unsafe` block (rules: English + crates.io safety docs).
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Interior-mutable `const` duplicates state per use site, silently.
declare_interior_mutable_const = "deny"
borrow_interior_mutable_const = "deny"
# Ownership / borrowing hygiene (rules_rust_ownership_borrowing_lifetimes).
redundant_clone = "warn"
needless_pass_by_value = "warn"
ptr_arg = "warn"
implicit_clone = "warn"
unnecessary_to_owned = "warn"
cloned_instead_of_copied = "warn"
map_clone = "warn"
mut_mut = "warn"
needless_lifetimes = "warn"

# Product rules the compiler can enforce, instead of six shell scripts and one
# home-grown regex scanner grepping for them after the fact. Every one below was
# measured at zero or near-zero violations before being switched on, so this is
# ratcheting a rule the code already follows — not a migration.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
float_cmp = "warn"
# All agent-consumable output goes through `src/output.rs`, which writes to a
# locked `io::stdout()` handle rather than through the print macros.
print_stdout = "warn"
print_stderr = "warn"
# `# Panics` on anything public that can panic. Switching this on found a real
# one: `retry_blocking` panicked when `max_attempts` was zero, a value reachable
# from an unvalidated XDG key.
missing_panics_doc = "warn"
# Zero `unwrap()` in production is a product rule that until now only a regex
# scanner enforced. `allow-unwrap-in-tests = true` in clippy.toml keeps fixtures
# out of it, where an unwrap IS the assertion.
unwrap_used = "warn"

# NOT enabled, with the measurement that decided it. Every count below names its
# cut, because the two cuts differ by more than an order of magnitude and an
# unqualified number is exactly what went wrong here: the previous version of
# this comment recorded 535 and 777, and re-measuring on 2026-08-25 reproduced
# neither under `--all-targets` nor under `--lib`. A number written without the
# command that produced it cannot be checked, only believed.
#
# Measured 2026-08-25 with `cargo clippy <cut> --all-features --locked
# --message-format=json -- -W clippy::<lint>`, counting `message.code.code`:
#
# `expect_used` — 503 across all targets, 19 in the library. The 19 are the
# production ones and they are infallible by construction: a literal regex in a
# `LazyLock`, `as_object_mut()` on a `json!` built two lines above,
# `DropAnchor::parse("center")`. Each is already documented at its line. Enabling
# the lint would add 19 `#[allow]` attributes that repeat what the doc comment
# already says, and would train reviewers to scroll past them. The other 484 are
# fixtures, where `allow-expect-in-tests = true` in clippy.toml would exempt them
# anyway.
#
# `indexing_slicing` — 1548 across all targets, 241 in the library. This is a
# `restriction` lint for codebases that must not panic at all; adopting it here
# is a rewrite of the codebase, not a configuration change. Recorded as an open
# item rather than switched on and blanket-allowed, which would be the same as
# not adopting it while pretending otherwise.

[[bin]]
name = "browser-automation-cli"
path = "src/main.rs"

[dependencies]
# Default CLI allocator (rules_rust_economia_de_recursos). Measure RSS via
# `scripts/rss-baseline.sh` before claiming wins vs system malloc.
mimalloc = { version = "0.1", default-features = false }
# Fast non-crypto hasher for trusted in-process maps (rules_rust_eficiencia —
# FxHash for digests / integer-like keys; not for untrusted DoS surfaces).
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
base64 = "0.22"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
# CPU-bound fan-out (sg scan, multi-file text); sized via concurrency::rayon_threads.
rayon = "1.10"
chromiumoxide = "0.9.1"
# Anti-detection payloads: the pre-navigation JS that masks automation markers,
# plus the Chrome identity tables (User-Agent, Client Hints brands, GPU vendor
# and renderer strings) those patches have to stay consistent with.
#
# Adopted after measuring the graph rather than on reputation: it adds exactly
# six crates this tree did not already have -- `case_insensitive_string`,
# `castaway`, `compact_str`, `serde_urlencoded`, `static_assertions` and itself
# -- and every one is pure Rust. No `*-sys`, no `cc` beyond what `ring` already
# required, nothing for `natives-check.sh` to reject. Hand-writing the same JS
# was the alternative and would have meant maintaining Chrome version tables,
# GPU strings and brand lists by hand, which age silently.
spider_fingerprint = "2.39"
futures = "0.3"
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
# 0.13 aligns with the reqwest chromiumoxide 0.9 already pulls (single copy in
# the graph). 0.13 split the old `rustls-tls-webpki-roots` feature into
# `rustls` + `webpki-roots`; the combination is the same TLS stack (rustls with
# bundled webpki roots, no native-tls).
#
# `http2` is on for DETECTION, not throughput. ALPN is offered in the clear
# during the TLS handshake and Chrome always lists `h2` there; a client built
# without the protocol advertises `http/1.1` alone and has answered "not a
# browser" before a single HTTP byte exists. The feature pulls the `h2` crate,
# which is pure Rust — verified against the `*-sys` allowlist in
# `scripts/natives-check.sh`, so it does not breach the no-C-toolchain rule.
#
# `gzip` + `brotli` + `deflate` + `zstd` are not throughput either: they are the
# other half of a header this product already sends. The stealth identity
# advertises `accept-encoding: gzip, deflate, br, zstd` because Chrome does, and
# a client that advertises an encoding it cannot decode hands the caller a
# gzip-framed byte string as if it were page text — with `ok: true` and exit 0.
# Measured on five hosts before the fix: every `data.text` began with the `1f 8b`
# gzip magic.
#
# Enabling them does NOT cost the disguise. reqwest 0.13 delegates to
# `tower_http::decompression`, which inserts its own `Accept-Encoding` only when
# the header is Vacant, and decompresses purely off the response's
# `Content-Encoding`. The hand-written header therefore survives and the body
# still arrives decoded.
#
# `cookies` closes the same class of defect one layer up: `--warmup` documented a
# cookie-store side effect the client never had, so the warm-up was heating a
# connection pool and nothing else.
#
# Dependency cost is zero. `flate2`, `brotli`, `async-compression`, `tower-http`
# and `zstd-sys` are already in `Cargo.lock` via `hudsucker`, which is an
# unconditional dependency below. No new C toolchain enters the graph; re-verify
# with `scripts/natives-check.sh`.
#
# Held at 0.13.1 rather than 0.13.4 on purpose. Measured 2026-08-08:
# `cargo update -p reqwest --precise 0.13.4` fails with "reqwest does not have
# that feature" for `webpki-roots`, which 0.13.4 folded away. Taking the bump
# means re-deciding where the trust roots come from, and there is no defect in
# 0.13.1 that would pay for that. Revisit deliberately, not as a version bump.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "stream", "blocking", "http2", "gzip", "brotli", "deflate", "zstd", "cookies"] }
sha2 = "0.10"
aes-gcm = "0.10"
# Wipe derived session encryption keys on stack before drop (rules: sensitive memory zeroize).
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
# socket2: transitive via tokio/hyper only (Pass N — no direct product use).
similar = "2"
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
clap = { version = "4", features = ["derive", "wrap_help", "string", "cargo", "color", "suggestions"] }
clap_complete = "4"
clap_mangen = "0.2"
thiserror = "2"
human-panic = "2"
# Cross-platform live-process enumeration for residual wipe safety (GAP-045).
# Pinned to 0.38 (not the newer 0.39) because human-panic already pulls
# sysinfo 0.38 transitively; declaring 0.39 would add a duplicate (GAP-022).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
# env-filter + fmt + registry: composition; json: file sink; tracing-log: bridge
# log crate records from deps (reqwest/etc.) into tracing events (local only).
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry", "tracing-log"] }
tracing-appender = "0.2"
tracing-error = "0.2"
# i18n stack (rules_rust multi-idioma): OS locale → BCP47 → negotiate → OnceLock.
# Full ICU calendar/collator intentionally omitted (agent CLI; machine JSON stays English).
sys-locale = "0.3"
# macros: langid! for compile-time identifiers (rules: unic-langid LanguageIdentifier).
unic-langid = { version = "0.9", features = ["macros"] }
# 0.14 switched to icu_locid::LanguageIdentifier and breaks fluent 0.17 (unic-langid).
# Pin 0.13 for a single LanguageIdentifier type across negotiation + FluentBundle.
fluent-langneg = "0.13"
fluent = "0.17"
unicode-segmentation = "1"
robotstxt = "0.3"
# Optional: Mermaid in rustdoc only. Keep off default builds to avoid
# proc-macro-error2 future-incompat on daily cargo install/build.
# docs.rs enables it via all-features = true.
aquamarine = { version = "0.6", optional = true }
directories = "5"
# 0.27 rather than 0.22 for `fxhash`: 0.22 pinned `selectors 0.26`, whose only
# hasher was `fxhash 0.2.1` — unmaintained since 2025-09-05 (RUSTSEC-2025-0057)
# and, until this bump, carried as a named exception in `deny.toml`. 0.27
# resolves `selectors 0.38`, which dropped `fxhash` outright, so the exception
# is retired rather than renewed. The API this crate touches is the stable core
# — `Html::parse_document`, `Selector::parse`, `select`, `text`, `value`, `attr`
# and `html` across 15 files — and none of it changed over the five minors.
scraper = "0.27"
encoding_rs = "0.8"
quick-xml = "0.41"
# RSS 0.9/1.0/2.0 + Atom + JSON Feed parsing for scrape `--format feed`.
# Pure Rust (quick-xml + serde); no C toolchain, no `*-sys`.
feed-rs = { version = "2.4", default-features = false }
petgraph = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
rcgen = "0.14.8"
hudsucker = "0.25.0"
# Reading an intercepted body needs `BodyExt::collect`, which hudsucker does not
# re-export. Both crates are already in `Cargo.lock` as transitive deps of
# hudsucker itself, so declaring them adds no compilation unit and no C: this
# only makes an existing edge visible to the build.
http-body-util = "0.1"
bytes = "1"
lopdf = "0.44"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
# 0.36 is required to pull quick-xml >= 0.41, which closes RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 (both severity 7.5, both reachable from the public `parse`
# command on operator-supplied XLSX). 0.36 does not link under `lto = "fat"`;
# the release profile uses `lto = "thin"` for this reason — see [profile.release].
calamine = "0.36"
rust_xlsxwriter = "0.79"
csv = "1.3"
ignore = "0.4"
regex = "1"
qrcode = "0.14"
# 0.10 rather than 0.9 for `lru`: 0.9.3 pinned `lru 0.12.5`, which carries two
# RustSec `unsound` advisories — RUSTSEC-2026-0002 (`IterMut` invalidates an
# internal pointer, violating Stacked Borrows) and RUSTSEC-2026-0253 (missing
# panic safety in `LruCache::pop`, a potential use-after-free). 0.10.1 resolves
# `lru 0.16.4`, which clears the first and NOT the second: RUSTSEC-2026-0253 is
# patched only in `>= 0.18.2`, and `rqrr 0.10.1` declares `lru = "^0.16"`, so no
# resolution of this manifest can reach the fix. That one advisory is upstream-
# bound until rqrr widens its requirement — measured 2026-08-29, not assumed,
# because the previous note in `deny.toml` called the whole `lru` pair upstream-
# bound and a bump cleared half of it.
# The API this crate touches — `PreparedImage::prepare`, `detect_grids` and
# `Grid::decode` in `src/qr_local.rs` — is unchanged across the bump, which is
# why a pre-1.0 minor was affordable here.
rqrr = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Pure-Rust EXIF reader for `image info` / `image exif` (no FFI; multiplatform).
kamadak-exif = "0.6"
# ── A known portability bug we are deliberately NOT pinning around ──────────
#
# `image`'s `jpeg` feature pulls `zune-jpeg`. In 0.5.15 — the current stable —
# `mcu_prog.rs` calls `warn!(...)` with no trailing semicolon, while
# `zune-core`'s `__warn!` expands to `#[cfg(feature = "std")] { }`. That is an
# attribute on a block: a statement, not an expression. The file compiles only
# on toolchains that still tolerate it. `rust-toolchain.toml` pins 1.88.0 here,
# which is precisely why the breakage is invisible on this host and fatal on a
# macOS host with a newer toolchain. A pinned toolchain was hiding a real
# portability bug.
#
# The fix exists upstream. Measured on 2026-08-08 by extracting both crates:
# the pattern occurs once in `0.5.15/src` and zero times in `0.5.16-rc1/src`,
# where the call now ends in a semicolon.
#
# It is nevertheless unreachable, and the attempt is recorded so nobody spends
# the afternoon again:
#
#   * `zune-jpeg = "=0.5.16-rc1"` as a direct dependency does NOT unify. Cargo
#     will not let a pre-release satisfy `image`'s `^0.5` requirement, so it
#     resolved by DOWNGRADING `image` 0.25.10 → 0.25.8, which depends on
#     `zune-jpeg` 0.4.21. Measured result: two copies of `zune-jpeg` in the
#     lock, the broken 0.5.15 replaced by an older 0.4.21, and the pinned rc1
#     sitting in the graph used by nobody. Strictly worse than doing nothing.
#   * `[patch.crates-io]` is not carried to consumers. Anyone running
#     `cargo install browser-automation-cli` would still build the broken file,
#     so it fixes the maintainer's laptop and not the product.
#   * Dropping the `jpeg` feature removes the crate, and with it
#     `image convert --format jpeg` and JPEG resize. Losing a shipped feature
#     to work around someone else's missing semicolon is the wrong trade.
#
# So the limit is declared instead of papered over: `doctor` reports it under
# `jpeg_decoder_toolchain`, and it closes by itself the day 0.5.16 goes stable
# and `cargo update` picks it up. Re-verify with:
#   cargo tree -i zune-jpeg   # expect a single 0.5.x

# ── Optional pure-Rust media codecs / parsers (Wave 6) ─────────────────────
# Every crate below was probed with `cargo tree -i cc` and `cargo tree -i nasm-rs`
# in isolation before landing. None introduces a C toolchain, a `*-sys` shim, or
# openssl. Reproduce with:
#   cargo tree -i nasm-rs -e all --all-features   # must report "did not match"
#   cargo tree -p <crate> -e build --all-features --depth 1   # must list no build-deps
# `cc` and `cmake` DO appear in the graph; no crate below reaches them. The note
# that used to sit here said they arrived "only via the pre-existing TLS stack".
# That was measured wrong. Auditing every `*-sys` crate in `Cargo.lock` on
# 2026-08-04 found FIVE C compilation units on a Linux host build, of which only
# two are TLS:
#
#   aws-lc-sys      ← rustls/aws_lc_rs        cc + cmake
#   ring            ← rcgen                   cc + asm   (our MITM CA)
#   libsqlite3-sys  ← rusqlite "bundled"      cc         (cache backend)
#   libmimalloc-sys ← mimalloc                cc         (default allocator)
#   zstd-sys        ← async-compression       cc         (via hudsucker "decoder")
#
# The remaining `*-sys` entries are bindings, not compiles: `linux-raw-sys` and
# `dirs-sys` are pure Rust, `windows-sys` binds system DLLs, and
# `core-foundation-sys` / `security-framework-sys` link macOS frameworks. Reproduce
# the audit with:
#   rg -o '^name = "([a-z0-9_-]+-sys)"' -r '$1' Cargo.lock | sort -u
#
# `cmake` is the only host prerequisite beyond a C compiler, and it comes from
# `aws-lc-sys` alone. `rustls/aws_lc_rs` is switched on from two independent
# places and only one is ours:
#
#   1. `reqwest/rustls` → `__rustls-aws-lc-rs`. Ours.
#   2. `hudsucker` → `tokio-rustls` declared WITHOUT `default-features = false`,
#      and `tokio-rustls`'s default set contains `aws_lc_rs`. Not ours.
#
# Cargo feature unification is additive, so (2) alone is enough to keep it.
# Measured: flipping (1) to `rustls-no-provider` and re-running
# `cargo tree -i aws-lc-sys` STILL reports `aws-lc-sys v0.43.0`. The change buys
# nothing and costs a manual `CryptoProvider::install_default()` that panics at
# runtime when forgotten, so it was tried and reverted rather than left in as
# cosmetic progress.
#
# Dropping cmake therefore needs `hudsucker` to set `default-features = false` on
# `tokio-rustls`. hudsucker 0.25.0 is the newest published release, so there is no
# version to upgrade into; dropping hudsucker deletes the whole `mitm` family and
# forking it trades a build prerequisite for a permanent fork. cmake stays a
# DOCUMENTED prerequisite instead of an undocumented surprise.
#
# `scripts/natives-check.sh` Pass N pins the `*-sys` allowlist, so a SIXTH C unit
# cannot arrive unnoticed and the day `aws-lc-sys` disappears the gate says so
# instead of letting an obsolete prerequisite live on in the docs forever.
#
# AVIF encode (`image-avif`). `default-features = false` is MANDATORY and not a
# style choice: ravif's default feature set enables `asm = ["rav1e/asm"]`, which
# makes rav1e pull `nasm-rs` + `cc` as build-dependencies and requires a system
# NASM assembler. `threading` is kept because rav1e's tile encoder is otherwise
# single-threaded and AVIF encode of a 4K frame becomes minutes, not seconds.
# AVIF *decode* has no C-free path in 2026: both `rav1d` 1.1 and `rav1d-safe`
# 0.5.7 declare `cc` and `nasm-rs` as UNCONDITIONAL build-dependencies (they are
# not gated by the `asm` feature), so decode stays rejected — see image_local::avif.
ravif = { version = "0.13", default-features = false, features = ["threading"], optional = true }
# Pixel container types required by ravif's `encode_rgb` / `encode_rgba` signatures.
# Both are dependency-free pure Rust; ravif does not re-export them.
imgref = { version = "1.12", optional = true }
rgb = { version = "0.8", optional = true }
# HEIC decode (`image-heic`), pure Rust over `rust_h265` (zero dependencies).
# Off by default: 0.1.0 is pre-1.0 and the HEVC intra decoder is young. Encode is
# NOT offered — no pure-Rust HEVC encoder exists, which is a physical limit.
heif-oxide = { version = "0.1.0", optional = true }
# SVG rasterisation (`image-svg`). resvg re-exports `usvg` and `tiny_skia`, so
# neither is declared directly. Off by default: fontdb + harfrust add ~4 MB of
# text-shaping machinery that a headless agent rarely needs.
resvg = { version = "0.47", default-features = false, optional = true }
# SIMD resize (`image-simd-resize`, on by default). The `image` feature wires
# `DynamicImage` straight into `Resizer` with no manual buffer marshalling.
fast_image_resize = { version = "6.1", features = ["image"], optional = true }
# HLS / DASH manifest parsing (`media-manifest`, on by default). Both are parse-only
# here. dash-mpd MUST stay `default-features = false`: its default set drags in a
# fetch stack (reqwest + tokio + decryption helpers) that duplicates ours.
m3u8-rs = { version = "6.0", optional = true }
dash-mpd = { version = "0.20", default-features = false, optional = true }
# Embedded text recognition is NOT declared here and never will be. This is a
# product rule, not a dependency trade-off: every agent that drives this CLI —
# Claude, Grok, Gemini — reads images natively, so shipping a second, worse
# reader inside the tool duplicates a capability the caller already has and then
# has to be kept current forever.
#
# The note that stood here until 2026-08-10 framed the omission as deferred,
# blocked on an MSRV bump, and pointed at `src/image_local/ocr_rs.rs` for "the
# refusal path". That file does not exist and never did. A comment describing a
# decision that was never taken, citing a file that was never written, is the
# same defect class as documentation that contradicts the code — it sends the
# next reader looking for a door in a wall.
#
# `image info` and `image exif` return metadata; pixels go to the agent.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Console",
    # free_ram_mb via GlobalMemoryStatusEx (rules_rust_paralelismo permits formula).
    "Win32_System_SystemInformation",
    # Chrome App Paths discovery (HKLM/HKCU …\App Paths\chrome.exe).
    "Win32_System_Registry",
] }

# Optional locale packs beyond MVP en + pt-BR (rules: never ship top-20 by default).
[features]
# Sensible default: the two media features that are pure-Rust, dependency-light,
# and already 1.0+. AVIF/HEIC/SVG stay opt-in — see each feature's note. Text
# recognition is not on this list because it is not a feature of this product.
default = ["image-simd-resize", "media-manifest"]
# AVIF encode via ravif (decode is impossible without a C assembler — see deps).
# Off by default: rav1e is a large compile unit and most agents never emit AVIF.
image-avif = ["dep:ravif", "dep:imgref", "dep:rgb"]
# HEIC decode via heif-oxide. Off by default while the crate is pre-1.0.
image-heic = ["dep:heif-oxide"]
# SVG sanitise + rasterise via resvg/usvg/tiny-skia.
image-svg = ["dep:resvg"]
# SIMD resize via fast_image_resize; falls back to `image::imageops` when off.
image-simd-resize = ["dep:fast_image_resize"]
# HLS (m3u8-rs) + DASH (dash-mpd) manifest parsing, parse-only.
media-manifest = ["dep:m3u8-rs", "dep:dash-mpd"]
# Mermaid lifecycle diagrams in rustdoc via aquamarine (docs.rs / cargo doc only).
# Not on default: aquamarine → proc-macro-error2 currently emits future-incompat.
docs-mermaid = ["dep:aquamarine"]
# Turn every announced skip in the integration suite into a hard failure.
#
# The suite prints "This is NOT a pass" and then returns normally, so libtest
# counts the test as passed. `scripts/ci-check.sh` runs `--all-features`, which
# enables this flag, so a declined gate now fails the run instead of hiding
# inside a green summary. Measured 2026-08-18: zero skips on a host with Chrome
# and a built binary, so enabling it changed nothing but what a green means.
strict-gates = []
# Scaffold only — additional FTL packs land behind these flags when translated.
i18n-cjk = []
i18n-rtl = []
i18n-europe = []
i18n-full = ["i18n-cjk", "i18n-rtl", "i18n-europe"]
i18n-pseudo = []

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"
# Fixture COMPRESSORS for `tests/compression_gate.rs`. Test-only: the product
# never compresses, it only decodes what a server sent. Both crates are already
# in the lock via the runtime graph, so this adds nothing to a release build —
# it just lets the gate build a body the same way a real server would, instead
# of pinning a checked-in blob nobody can re-derive.
flate2 = "1"
brotli = "8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cli_parse"
harness = false

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Release (rules_rust_eficiencia_e_performance) ───────────────────────────
# Speed-first profile for the one-shot agent binary. Cross-crate LTO + single
# CGU maximize inlining; panic=abort drops unwind tables (CLI never catches
# panics for recovery). strip=symbols keeps distributed artifacts small.
# overflow-checks left at release default (false) after audit: no financial
# math hot path; debug/test profiles keep checks on.
# Never set target-cpu=native here — that belongs only to local .cargo overrides.
[profile.release]
opt-level = 3
# "thin" and NOT "fat" — deliberate, security-driven (GAP-001).
#
# calamine 0.36 references the encoding_rs statics (UTF_8 / UTF_16LE / UTF_16BE)
# from `open_workbook` and `cfb`. Under `lto = "fat"` those symbols are dropped
# and `cargo build --release` fails to link (reproduced with both mold and GNU
# ld.bfd, after `cargo clean -p calamine -p encoding_rs`). `lto = "thin"` links.
#
# Staying on calamine 0.30 to keep fat LTO would keep quick-xml 0.37, which
# carries RUSTSEC-2026-0194 (quadratic parse on duplicate attribute names) and
# RUSTSEC-2026-0195 (unbounded namespace allocation). Both are severity 7.5 and
# both are reachable from the public `parse` command on operator-supplied XLSX.
#
# Measured cost of thin: ~30.41 MB (fat/0.30) to ~31.70 MB (thin/0.36), about
# +4%. Trading 1.29 MB for two reachable DoS advisories is not a trade worth
# making. Revisit fat LTO only if upstream calamine/encoding_rs fixes the drop.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

# Explicit dependency optimisations (rules: [profile.release.package."*"]).
# Root package already uses opt-level=3; this documents and pins deps the same
# way so a future package-level override cannot silently ship soft deps.
[profile.release.package."*"]
opt-level = 3

# Size-optimized alternate (cargo build --profile release-size). Same LTO/CGU
# stack as release; opt-level "z" trades some speed for smaller text.
[profile.release-size]
inherits = "release"
opt-level = "z"

# Latency / flamegraph profiling (rules_rust_latencia_reduzir): keep LTO/CGU
# and panic=abort from release, but retain line tables (`debug = 1`) and do not
# strip symbols so `perf` / `cargo flamegraph` can attribute samples.
# Usage: cargo build --profile release-prof
# Not for distribution — use [profile.release] for published binaries.
[profile.release-prof]
inherits = "release"
debug = 1
strip = "none"

# Criterion / cargo bench: match production optimisations so microbenches are
# not compared against a soft dev build (rules: never debug vs release).
[profile.bench]
inherits = "release"
# Criterion harness needs unwind; Cargo forces unwind for benches regardless.
debug = false
lto = "thin"
codegen-units = 1

# Dev: keep our crate debuggable, but optimise dependencies so CDP/reqwest
# paths are usable without a full --release rebuild every iteration.
[profile.dev.package."*"]
opt-level = 2

# Build scripts / proc-macros: prefer compile speed over runtime optimisations.
[profile.dev.build-override]
opt-level = 0
codegen-units = 16

[profile.release.build-override]
opt-level = 0
codegen-units = 16

