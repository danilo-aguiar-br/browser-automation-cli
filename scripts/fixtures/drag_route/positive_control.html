<!doctype html>
<!--
  POSITIVE CONTROL for the drag-route gate (GAP-030).

  The page owns the whole drag contract: it registers `dragstart` and puts a
  token on the DataTransfer that only it could produce. A CLI that truly drove
  the page's own handler drops THAT token; a CLI that fabricated a payload
  cannot. The drop handler rejects any payload without the token, so a
  synthetic route cannot reorder the list even by accident.

  Expected: route == "intercepted" AND the list reorders.
-->
<html><head><meta charset="utf-8"><title>drag route positive</title>
<style>
  body { font: 16px sans-serif; margin: 0; padding: 8px; }
  ul { list-style: none; padding: 0; width: 300px; }
  li { border: 1px solid #999; padding: 12px; background: #eee; }
</style></head>
<body>
<ul id="list">
  <li draggable="true" id="a">alpha</li>
  <li draggable="true" id="b">bravo</li>
  <li draggable="true" id="c">charlie</li>
</ul>
<script>
let dragged = null;
const list = document.getElementById('list');
list.addEventListener('dragstart', (e) => {
  dragged = e.target;
  e.dataTransfer.setData('application/x-page-owned', 'PAGE_OWNED:' + e.target.id);
  e.dataTransfer.effectAllowed = 'move';
});
list.addEventListener('dragover', (e) => { e.preventDefault(); });
list.addEventListener('drop', (e) => {
  e.preventDefault();
  const token = e.dataTransfer.getData('application/x-page-owned');
  const li = e.target.closest('li');
  if (!dragged || !li || li === dragged) return;
  if (!token.startsWith('PAGE_OWNED:')) return;
  const r = li.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height / 2;
  li.parentNode.insertBefore(dragged, after ? li.nextSibling : li);
});
</script>
</body></html>
