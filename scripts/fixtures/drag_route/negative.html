<!doctype html>
<!--
  NEGATIVE case for the drag-route gate (GAP-030).

  Same geometry, no `draggable` attribute and no `dragstart` handler. The page
  produces no DataTransfer, so `Input.dragIntercepted` never fires and the CLI
  MUST report the degraded route with an explicit warning.

  This is what proves the gate discriminates: a gate that only ever saw the
  positive page would also pass if it asserted nothing at all.

  Expected: route == "synthetic_mouse" AND a warning is present.
-->
<html><head><meta charset="utf-8"><title>drag route negative</title>
<style>
  body { font: 16px sans-serif; margin: 0; padding: 8px; }
  ul { list-style: none; padding: 0; width: 300px; }
  li { border: 1px solid #999; padding: 12px; background: #eee; }
</style></head>
<body>
<ul id="list">
  <li id="a">alpha</li>
  <li id="b">bravo</li>
  <li id="c">charlie</li>
</ul>
</body></html>
