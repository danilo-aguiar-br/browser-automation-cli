# cargo-deny config (optional local / CI). See scripts/ci-check.sh.
# Product law: no runtime product secrets via env; audit advisories still apply.

[advisories]
# cargo-deny 0.19 schema: `vulnerability` and `notice` were removed (advisories
# are always an error now) and `unmaintained` became a scope selector.
#
# The scope was `workspace`, on the reasoning that `all` would be noisy about
# transitive crates we cannot fix. Measured on 2026-08-25 with cargo-deny
# 0.20.2, that reasoning cost the gate its only finding: under `workspace` the
# check reported `advisories ok: 0 errors, 0 warnings, 0 notes` in 4 ms across
# 583 crates, while `cargo audit` on the same lockfile reported five. Under
# `all` exactly one of those five surfaces, and it is now named in `ignore`
# below. A gate that sees one thing and accepts it out loud is worth more than a
# gate that sees nothing and calls it clean.
unmaintained = "all"
yanked = "warn"
# THIS CHECK IS NOT A SUBSTITUTE FOR `cargo audit`. Measured on 2026-08-25 with
# cargo-deny 0.20.2 and this file at maximum coverage — `unmaintained = "all"`
# plus `-D unsound` on the command line — the check still reports only
# RUSTSEC-2025-0057. Advisories that `cargo audit` finds on the identical
# lockfile stay invisible to it, so any pre-publish gate that runs `cargo deny`
# and skips `cargo audit` is blind to them. `scripts/ci-check.sh` runs both, in
# that order, and must keep doing so.
#
# Remeasured 2026-08-29 after the dependency work below: `cargo audit` went from
# six warnings to three, and the `ignore` list went from one entry to none.
#  - RUSTSEC-2025-0057 (fxhash) — GONE. `scraper 0.22 -> selectors 0.26` was the
#    only path to it; `scraper 0.27` resolves `selectors 0.38`, which dropped the
#    dependency. The old ignore said "no safe upgrade", and that was never
#    measured: the upgrade had been published.
#  - RUSTSEC-2026-0002 (lru, IterMut) — GONE. `rqrr 0.9 -> 0.10` moved
#    `lru 0.12.5` to 0.16.4.
#  - chacha20 0.10.1 yanked — GONE, 0.10.2 was a same-series bump.
# What remains, each verified upstream-bound rather than assumed:
#  - RUSTSEC-2026-0253 (lru, panic safety in `pop`) — patched in `>= 0.18.2`,
#    but `rqrr 0.10.1` declares `lru = "^0.16"`, so no resolution reaches it.
#  - RUSTSEC-2024-0436 (paste) — via `ravif 0.13 -> rav1e 0.8.1`, and 0.13 is the
#    newest ravif. Feature `image-avif`, off by default.
#  - RUSTSEC-2026-0173 (proc-macro-error2) — via `aquamarine 0.6.0`, the newest
#    release. Feature `docs-mermaid`, off by default, rustdoc only.
#
# The lesson worth more than the numbers: "no safe upgrade" is a claim about the
# registry, and it decays silently. Every entry that ever lands here must name
# the version that would fix it and the requirement that blocks that version, so
# the next reader can recheck in one command instead of trusting this file.
ignore = []

[licenses]
# `unlicensed` was removed in cargo-deny 0.19: any crate whose license is not in
# `allow` below is already rejected.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # NOT "Unicode-DFS-2016": the ICU crates relicensed to Unicode-3.0 and nothing
  # in the graph carries the old identifier. cargo-deny reported the allowance as
  # `license-not-encountered`, i.e. a permission granted to no one. A dead
  # allowance is not neutral: it silently admits the next crate that arrives
  # under it, which is the same reasoning that removed "OpenSSL" below.
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # NOT "OpenSSL": the product bans that TLS stack outright and ships rustls
  # only. The allowance was inert (cargo-deny reported it as an unmatched
  # license) but it stated a permission the product does not grant, so a crate
  # arriving under it would have passed this gate. `scripts/natives-check.sh`
  # catches openssl in the dependency graph; this file must not disagree with it.
  "CC0-1.0",
  "BSL-1.0",
  # webpki-roots / webpki-root-certs ship Mozilla's CA bundle under CDLA-
  # Permissive-2.0 (a permissive *data* license). Unavoidable for the rustls +
  # webpki-roots TLS stack that both reqwest and hudsucker pull in.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# NO `[[licenses.exceptions]]` for libfuzzer-sys: the crate is absent from the
# manifest and there is no `fuzz/` directory, so cargo-deny reported the
# exception as `license-exception-not-encountered`. The exception described
# infrastructure that does not exist, which is a permission granted in advance
# to a dependency nobody reviewed. Restore it in the same commit that adds the
# fuzz target, never before.

[bans]
multiple-versions = "warn"
wildcards = "allow"

# The product bans OpenSSL: TLS is rustls with bundled webpki roots, and a C
# TLS stack would add a build dependency this crate refuses to carry on three
# platforms. Until 2026-08-26 that rule was honoured by crate CHOICE alone and
# imposed by nothing — an audit could only confirm it by reading the lockfile,
# and the next dependency bump could have reintroduced it silently. Naming the
# crates here is what makes the rule testable.
#
# `openssl-probe` is deliberately NOT banned. It arrives transitively through
# rustls-native-certs -> rustls-platform-verifier -> reqwest, and it only
# resolves the host's certificate-bundle PATH; it links no libssl and pulls no C
# TLS. Banning it by name similarity would force an exception the moment the
# platform verifier is used at all, which is the shape of a rule nobody keeps.
deny = [
    { crate = "openssl-sys", reason = "C OpenSSL: TLS is rustls; see the rustls-tls feature pin on reqwest" },
    { crate = "openssl", reason = "C OpenSSL: TLS is rustls; see the rustls-tls feature pin on reqwest" },
    { crate = "native-tls", reason = "delegates to the platform C TLS stack, which is the same dependency by another name" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
